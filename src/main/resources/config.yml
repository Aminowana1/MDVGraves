# ==========================================================
# MDVGraves 1.1.2 - Bolsas de muerte + cuerpos offline para MDVCRAFT
# ==========================================================
settings:
  enabled: true

  # Solo en estos mundos se crean bolsas. En los demás, muerte vanilla normal.
  enabled-worlds:
    - world

  # 7 días mientras nadie la haya abierto.
  unopened-expire-hours: 168

  # Desde la primera apertura, quedan 20 minutos.
  opened-expire-minutes: 20

  # Una consulta SQLite por intervalo. No revisa tumbas por tick.
  cleanup-interval-seconds: 300

  # Si no puede colocar una cabeza de forma segura, deja los drops vanilla.
  placement-search-radius: 2

  # Algunos suelos parciales no sostienen correctamente una cabeza de suelo.
  # Solo se revisa cuando realmente se crea una tumba; no añade tareas periódicas.
  # DIRT_PATH y FARMLAND se convierten a DIRT bajo la bolsa.
  placement-support-fixes:
    enabled: true
    replacements:
      DIRT_PATH: DIRT
      FARMLAND: DIRT

  # La bolsa sustituye directamente alfombras, capas de nieve, cultivos,
  # vegetación y otros bloques finos. El bloque sustituido no genera drops.
  replace-thin-blocks: true

  # Revisa únicamente bolsas que estén abiertas. Si otro plugin consigue cambiar
  # físicamente una, cierra sus inventarios, guarda una sola copia y la restaura.
  open-grave-integrity-check-ticks: 1

  remove-when-empty: true
  # true: una explosión que alcance la bolsa la rompe y suelta su contenido normal.
  # false: las bolsas son inmunes a explosiones.
  explosions-break-graves: true
  protect-from-pistons: true
  protect-from-fluids: true

  # Las bolsas son una excepción intencional a las protecciones de región:
  # cualquier jugador puede abrirlas y romperlas para conservar el loot PvP.

  # Cualquier jugador puede abrir o romper cualquier bolsa.
  only-owner-can-open: false

  # Al romperla, su contenido cae una sola vez como drops normales.
  break-drops-items: true

  # Evita dos inventarios simultáneos sobre la misma bolsa.
  # Aunque se desactive, todos comparten un único inventario canónico.
  single-viewer-lock: true


# ==========================================================
# CUERPOS AL DESCONECTARSE
# ==========================================================
# Si un jugador sale en un mundo permitido, su cuerpo queda vulnerable durante
# unos segundos. La entidad es solo una representación visual: los items
# canónicos permanecen en el snapshot persistente de MDVGraves.
logout-body:
  enabled: true

  # Solo funciona en el survival principal.
  allowed-worlds:
    - world

  duration-seconds: 10

  appearance:
    # El cuerpo intenta copiar el perfil visual VIVO del jugador al desconectarse.
    # Eso ya refleja el resultado final de MDVAspectos + SkinsRestorer.
    # Si la versión de LibsDisguises no permite clonar el perfil vivo, se usa
    # skin-memory.yml de MDVAspectos como fallback de nombre de skin.
    provider-priority:
      - MDVAspectos
      - SkinRestorer
      - PLAYER_PROFILE

    use-saved-mdvaspectos-state: true
    preserve-skin-clear-state: true
    use-libsdisguises: true
    show-player-name: true

  entity:
    base-type: HUSK
    copy-equipment: true
    copy-health: true
    copy-absorption: true

    # El cuerpo cae como una entidad normal y recibe daño de caída vanilla.
    gravity: true
    fall-damage: true

    ai: false
    allow-knockback: true
    natural-drops: false

  reconnect:
    remove-body-immediately: true
    restore-body-location: true
    restore-body-health: true
    restore-body-absorption: true
    restore-inventory: true

  # MDVGraves conserva automáticamente los MMOItems con
  # MMOITEMS_DISABLE_DEATH_DROP=true y los Soulbound que pertenezcan al jugador
  # cuando MMOItems tenga soulbound.keep-on-death: true.
  # También puedes declarar tags PDC propios que deban sobrevivir a la muerte.
  protected-items:
    persistent-data-keys: []

  death:
    create-grave: true
    broadcast-death-message: true

    # El jugador no murió como entidad Player real, por lo que se emula la
    # pérdida de experiencia vanilla al aplicar el castigo tras autenticarse.
    reset-experience: true

    # IMPORTANTE con nLogin: MDVGraves espera la autenticación y después
    # teletransporta al spawn de este mundo, por lo que el teleport de nLogin
    # hacia la última posición no gana.
    lobby-world: world5

    messages:
      player: '&c{player} fue asesinado por {killer}.'
      mob: '&c{player} fue abatido por {killer}.'
      environment: '&c{player} murió mientras estaba desconectado.'

  nlogin:
    # Se ejecuta unos ticks después de AuthenticateEvent para quedar por encima
    # del retorno de nLogin a la última posición.
    after-auth-delay-ticks: 1

    # Mantiene GRAVE_CREATED un poco después de autenticar para cubrir teleports o
    # restauraciones tardías de nLogin. Durante esta ventana no puede salir de world5
    # ni mover el inventario. 60 ticks = 3 segundos.
    post-auth-lock-ticks: 60

    # Mientras exista una muerte offline pendiente, se permiten teleports hacia
    # world5 pero se bloquea el retorno de nLogin a cualquier otro mundo.
    lock-to-lobby-until-applied: true

  safety:
    ignore-server-shutdown: true

    # Un jugador en CREATIVE nunca deja cuerpo al desconectarse.
    ignore-creative-mode: true

    # Quien tenga este permiso nunca deja cuerpo, incluso dentro de allowed-worlds.
    # Déjalo vacío para desactivar el bypass por permiso.
    bypass-permission: 'mdvgraves.logoutbody.bypass' 
    prevent-duplicate-bodies: true
    persist-dead-state: true

# ==========================================================
# UTILIDADES POR PERMISO
# ==========================================================
utilities:
  back-grave:
    enabled: true

    # Permite también usar /back grave sin reemplazar el /back de Essentials.
    intercept-back-grave: true

    # 0 desactiva el cooldown.
    cooldown-seconds: 30

    # Busca un punto seguro alrededor de la última bolsa.
    safe-search-radius: 3

    # Vacío = sin sonido.
    sound: 'entity.enderman.teleport'

  # Consumible MMOItems: Fruta de la Muerte.
  # Debe ser un item del tipo/ID configurados y tener desactivado el consumo
  # automático por clic derecho en MMOItems. MDVGraves quita 1 unidad solo
  # DESPUÉS de un teleport exitoso.
  #
  # Comando que debe ejecutar MMOItems DESDE CONSOLA al consumir:
  # mdvgraves deathfruit %player%
  death-fruit:
    enabled: true
    mmoitems-type: 'CONSUMABLE'
    mmoitems-id: 'FRUTA_DE_LA_MUERTE'

    # Anti doble-disparo del mismo clic/skill. No es cooldown de gameplay.
    use-lock-ms: 750

    # Ventana para asociar el clic del MMOItem con el comando de consola.
    # Permite detectar si MMOItems descontó el item antes del comando y devolverlo
    # automáticamente si el graveback falla.
    pending-use-max-age-ms: 2000

    # Vacío = sin sonido.
    sound: 'entity.enderman.teleport'

  private-graves:
    enabled: true

    # Las bolsas creadas por jugadores con mdvgraves.private
    # tampoco se rompen mediante explosiones.
    protect-from-explosions: true

  keep-inventory:
    enabled: true

inventory:
  title: '&8Bolsa perdida de &e{owner}'
  # Debe ser múltiplo de 9, entre 9 y 54. Si hay más objetos, se ajusta hasta 54.
  minimum-size: 27

textures:
  # Se evalúan de arriba hacia abajo. La primera permission que cumpla gana.
  ranks:
    admin:
      permission: 'mdvgraves.texture.admin'
      texture: ''
    vip:
      permission: 'mdvgraves.texture.vip'
      texture: ''

  # Base64 completo de textures.minecraft.net. Vacío = cabeza de jugador normal.
  default: ''

